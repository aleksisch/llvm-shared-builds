name: build-llvm
on:
  workflow_dispatch:
    inputs:
      llvm_version:
        description: "LLVM version (e.g. 22.1.5)"
        required: true
        default: "22.1.5"
      llvm_major:
        description: "LLVM major (e.g. 22)"
        required: true
        default: "22"

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux_64
            os: ubuntu-22.04
          - name: linux_arm64
            os: ubuntu-22.04-arm
          # - name: mac_64
          #   os: macos-13   # Intel runner unavailable on free tier; needs macos-15-large (paid)
          - name: mac_arm64
            os: macos-14
          - name: win64
            os: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: install LLVM (Linux)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          set -euxo pipefail
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh ${{ inputs.llvm_major }}
          sudo apt-get install -y libllvm${{ inputs.llvm_major }}
          SO=$(ls /usr/lib/llvm-${{ inputs.llvm_major }}/lib/libLLVM.so.* | head -n1)
          cp "$SO" LLVM.dll
          strip --strip-unneeded LLVM.dll

      - name: install LLVM (macOS)
        if: startsWith(matrix.os, 'macos')
        run: |
          set -euxo pipefail
          brew update
          brew install llvm@${{ inputs.llvm_major }}
          PFX=$(brew --prefix llvm@${{ inputs.llvm_major }})
          cp "$PFX/lib/libLLVM.dylib" LLVM.dll
          chmod u+w LLVM.dll
          strip -x LLVM.dll
          codesign --force --sign - LLVM.dll  # re-sign after strip invalidated signature

      - name: install LLVM (Windows)
        if: startsWith(matrix.os, 'windows')
        shell: pwsh
        run: |
          $ver = "${{ inputs.llvm_version }}"
          $url = "https://github.com/llvm/llvm-project/releases/download/llvmorg-$ver/LLVM-$ver-win64.exe"
          Invoke-WebRequest -Uri $url -OutFile inst.exe
          # NSIS installer is a 7z archive — extract without running
          7z x inst.exe -ollvm -y | Out-Null
          Copy-Item llvm\bin\LLVM-C.dll LLVM.dll
          Copy-Item llvm\bin\clang-cl.exe .

      - name: package
        shell: bash
        run: |
          set -euxo pipefail
          EXTRA=""
          if [ -f clang-cl.exe ]; then EXTRA="clang-cl.exe"; fi
          tar czf ${{ matrix.name }}_llvm.tar.gz LLVM.dll $EXTRA
          if command -v sha256sum >/dev/null; then
            sha256sum ${{ matrix.name }}_llvm.tar.gz | tee ${{ matrix.name }}_llvm.tar.gz.sha256
          else
            shasum -a 256 ${{ matrix.name }}_llvm.tar.gz | tee ${{ matrix.name }}_llvm.tar.gz.sha256
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}_llvm
          path: |
            ${{ matrix.name }}_llvm.tar.gz
            ${{ matrix.name }}_llvm.tar.gz.sha256

  release:
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: collect sha256
        run: |
          set -euxo pipefail
          cd artifacts
          ls -la
          cat *.sha256 > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.llvm_version }}
          name: LLVM ${{ inputs.llvm_version }} prebuilt
          body_path: artifacts/SHA256SUMS
          files: artifacts/*_llvm.tar.gz
          draft: true
